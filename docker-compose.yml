services:
  gh-claude:
    build: .
    container_name: gh-claude
    network_mode: host
    volumes:
      - ./worktrees:/tmp/claude-runner
      - ./data:/tmp/claude-data
    environment:
      - GH_TOKEN=${GH_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_API_BASE_URL=${CLAUDE_API_BASE_URL}
      - CLAUDE_MODEL=${CLAUDE_MODEL}
      - HOME=/home/appuser
    restart: unless-stopped
