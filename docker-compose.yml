services:
  gh-claude:
    build: .
    container_name: gh-claude
    network_mode: host
    volumes:
      - /tmp/claude-runner:/tmp/claude-runner
    environment:
      - GH_TOKEN=${GH_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_API_BASE_URL=${CLAUDE_API_BASE_URL}
      - CLAUDE_MODEL=${CLAUDE_MODEL}
    restart: unless-stopped
