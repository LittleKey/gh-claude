services:
  gh-claude:
    build: .
    container_name: gh-claude
    network_mode: host
    volumes:
      - /tmp/claude-runner:/tmp/claude-runner
    environment:
      - GH_TOKEN=${GH_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_API_BASE_URL=${CLAUDE_API_BASE_URL:-https://api.minimaxi.com/anthropic}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-MiniMax-M2.5}
      - HOME=/home/appuser
      - ANTHROPIC_BASE_URL=${CLAUDE_API_BASE_URL:-https://api.minimaxi.com/anthropic}
      - ANTHROPIC_MODEL=${CLAUDE_MODEL:-MiniMax-M2.5}
      - CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1
    restart: unless-stopped
